name: SonarQube

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history is required for accurate new-code detection.
          # With the default shallow clone the quality gate on new code is wrong.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          # SonarQube Cloud: omit SONAR_HOST_URL (defaults to sonarcloud.io).
          # SonarQube Server: set SONAR_HOST_URL to your instance, e.g.
          #   https://itmethods-stage.devopsx.io
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

      # Optional: block the merge until the quality gate passes.
      # Requires the analysis above to have completed.
      # - name: Quality gate
      #   uses: SonarSource/sonarqube-quality-gate-action@v1
      #   timeout-minutes: 5
      #   env:
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
