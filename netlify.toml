[build]
  command = "npm run build:client"
  functions = "netlify/functions"
  publish = "dist/spa"

[functions]
  external_node_modules = ["express", "@supabase/supabase-js", "nodemailer"]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# SPA fallback - serve index.html for all routes so React Router can handle client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
