# SonarCloud (SonarQube Cloud) configuration for ebc-webcode.
#
# sonar.token is supplied by CI as SONAR_TOKEN and is deliberately NOT stored here.
# sonar.host.url is not set: the scan action defaults to SonarCloud.

# --- Identity -----------------------------------------------------------------
# Must match the project created by the SonarCloud import.
sonar.organization=CHANGE_ME_ORG_KEY
sonar.projectKey=vinod-itmethods_ebc-webcode
sonar.projectName=ebc-webcode

# --- Sources & tests ----------------------------------------------------------
sonar.sources=client,server,shared
sonar.tests=client,server,shared
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx
sonar.sourceEncoding=UTF-8

# --- Exclusions ---------------------------------------------------------------
sonar.exclusions=**/node_modules/**,dist/**,public/**,data/**,coverage/**,reports/**,pnpm-lock.yaml,**/*.css

# --- Coverage import ----------------------------------------------------------
# LCOV produced by vitest + @vitest/coverage-v8 (see `test` block in vite.config.ts).
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Coverage is only meaningful for code under test; UI/config/entrypoints are
# excluded so the new-code coverage gate stays actionable.
sonar.coverage.exclusions=**/*.spec.ts,**/*.spec.tsx,**/*.test.ts,**/*.test.tsx,client/main.tsx,client/App.tsx,**/vite.config*.ts,tailwind.config.ts,postcss.config.js,server/node-build.ts

# --- Test execution import ----------------------------------------------------
# Generic test execution XML from vitest-sonar-reporter.
# NOTE: sonar.junit.reportPaths is Java-only and will NOT work for TS/JS.
sonar.testExecutionReportPaths=reports/test-report.xml
