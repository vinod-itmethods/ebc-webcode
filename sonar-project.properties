# SonarQube analysis configuration for ebc-webcode (TypeScript / React + Express).
#
# sonar.host.url and sonar.token are supplied by CI as SONAR_HOST_URL / SONAR_TOKEN
# and are deliberately NOT stored in this file.

# --- Identity -----------------------------------------------------------------
# Set these to match the project created by the SonarQube Cloud import.
# sonar.organization applies to SonarQube Cloud only; omit it on SonarQube Server.
sonar.organization=CHANGE_ME_ORG_KEY
sonar.projectKey=vinod-itmethods_ebc-webcode
sonar.projectName=ebc-webcode

# --- Sources & tests ----------------------------------------------------------
sonar.sources=client,server,shared
sonar.tests=client,server,shared
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx
sonar.sourceEncoding=UTF-8

# --- Exclusions ---------------------------------------------------------------
sonar.exclusions=**/node_modules/**,dist/**,public/**,data/**,pnpm-lock.yaml,**/*.css

# --- Coverage -----------------------------------------------------------------
# No coverage provider is installed yet. To enable:
#   pnpm add -D @vitest/coverage-v8
#   pnpm vitest --run --coverage --coverage.reporter=lcov
# then uncomment:
# sonar.javascript.lcov.reportPaths=coverage/lcov.info
# sonar.typescript.lcov.reportPaths=coverage/lcov.info
