sonar.projectKey=vinod-itmethods_ebc-webcode
sonar.organization=itmethods-inc

sonar.sources=client,server,shared,netlify
sonar.tests=client
sonar.test.inclusions=**/*.spec.ts,**/*.spec.tsx,**/*.test.ts,**/*.test.tsx
sonar.sca.enabled=true
sonar.exclusions=dist/**,node_modules/**,public/**,.scannerwork/**,client/components/ui/**

# Coverage produced by `pnpm test:coverage` (vitest + v8 provider)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/*.spec.ts,**/*.spec.tsx,**/*.config.ts,**/*.config.js,client/components/ui/**,server/node-build.ts

sonar.sourceEncoding=UTF-8
