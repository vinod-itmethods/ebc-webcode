# SonarCloud (SonarQube Cloud) configuration for ebc-webcode.
#
# sonar.token is supplied by CI as SONAR_TOKEN and is deliberately NOT stored here.
# sonar.host.url is intentionally omitted: the scan action defaults to SonarCloud,
# and hardcoding it here conflicts with SONAR_HOST_URL if CI ever sets it.

# --- Identity -----------------------------------------------------------------
sonar.organization=itmethods-inc
sonar.projectKey=vinod-itmethods_ebc-webcode
sonar.projectName=EBC Webcode
sonar.projectVersion=1.0

# NOTE: sonar.language is deliberately NOT set. It was removed from SonarQube
# years ago and restricts analysis to a single language, silently dropping
# everything else (.tsx, JS config files). Language detection is automatic.

# --- Sources & tests ----------------------------------------------------------
sonar.sources=client,server,shared
sonar.tests=client,server,shared
sonar.test.inclusions=**/*.spec.ts,**/*.spec.tsx,**/*.test.ts,**/*.test.tsx
sonar.sourceEncoding=UTF-8
sonar.typescript.tsconfigPath=tsconfig.json

# --- Exclusions ---------------------------------------------------------------
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/reports/**,**/public/**,**/data/**,**/client/components/ui/**,pnpm-lock.yaml,**/*.css

# --- Coverage import ----------------------------------------------------------
# LCOV produced by vitest + @vitest/coverage-v8 (see `test` block in vite.config.ts).
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

sonar.coverage.exclusions=**/*.spec.ts,**/*.spec.tsx,**/*.test.ts,**/*.test.tsx,**/client/components/ui/**,client/main.tsx,client/App.tsx,**/vite.config*.ts,tailwind.config.ts,postcss.config.js,server/node-build.ts

# --- Test execution import ----------------------------------------------------
# Generic test execution XML from vitest-sonar-reporter.
# NOTE: sonar.junit.reportPaths is Java-only and will NOT work for TS/JS.
sonar.testExecutionReportPaths=reports/test-report.xml
